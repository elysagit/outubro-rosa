<!DOCTYPE html>

    <meta charset="UTF-8">

    <title data-i18n="titulo_site">Contato • Outubro Rosa</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Botões de idioma no topo */
        .idiomas {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }
        .idiomas button {
            margin: 0 4px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: #ff5fa2;
            color: white;
            transition: 0.3s;
        }
        .idiomas button:hover {
            background-color: #ff82b9;
        }
    </style>
</head>
<body>

<!-- BOTÕES DE IDIOMA -->
<div class="idiomas">
    <button onclick="setLanguage('pt')">🇧🇷 PT</button>
    <button onclick="setLanguage('en')">🇺🇸 EN</button>
    <button onclick="setLanguage('es')">🇪🇸 ES</button>
    <button onclick="setLanguage('fr')">🇫🇷 FR</button>
    <button onclick="setLanguage('de')">🇩🇪 DE</button>
</div>

<!-- MENU -->
<header class="menu">

        <a href="famosas.html" data-i18n="menu_famosas">Famosas</a>
        <a href="informacoes.html" data-i18n="menu_informacoes">Informações</a>
        <a href="contato.html" class="ativo" data-i18n="menu_contato">Contato</a>
    </nav>
</header>

<!-- FORMULÁRIO DE CONTATO -->
<section class="card page">
    <h2 data-i18n="contato_titulo">Entre em Contato</h2>
    <p data-i18n="contato_texto">Envie uma mensagem pelo WhatsApp preenchendo o formulário abaixo:</p>

    <form id="formWhats" class="form-contato">
        <label data-i18n="form_nome">Seu nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label data-i18n="form_mensagem">Sua mensagem:</label>
        <textarea id="mensagem" placeholder="Escreva sua mensagem..." required></textarea>

        <button type="submit" class="botao" data-i18n="botao_whats">Enviar pelo WhatsApp</button>
    </form>
</section>


<!-- SCRIPT DE WHATSAPP -->
<script>
document.getElementById("formWhats").addEventListener("submit", function(e) {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const mensagem = document.getElementById("mensagem").value;
    const texto = `Olá! Meu nome é ${nome}.%0A%0A${mensagem}`;
    const telefone = "5511999999999"; // insira o número do WhatsApp aqui
    const url = `https://wa.me/${telefone}?text=${texto}`;
    window.open(url, "_blank");
});
</script>

function setLanguage(lang) {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerHTML = translations[lang][key] || el.innerHTML;
    });
    document.title = translations[lang]["titulo_site"];
}
